[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "equivariant-architecture-self-evolution"
version = "0.1.0"
description = "Typed-DSL, symmetry-preserving architecture evolution for Equiformer"
requires-python = ">=3.8"

[tool.setuptools.packages.find]
include = ["equivariant_nas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = ["第三方源码", "reports", "tmp", ".tmp"]
